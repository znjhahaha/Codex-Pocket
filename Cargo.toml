[workspace]
resolver = "2"
members = ["crates/bridge", "crates/core", "crates/cli-adapter", "crates/tunnel", "crates/relay", "crates/agent"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

