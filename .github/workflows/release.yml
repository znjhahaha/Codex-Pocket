name: Release draft
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or inspect
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.state.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: state
        name: Select unpublished release work
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release_state.py draft
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.state.outputs.build == 'true'
        with:
          ref: refs/tags/${{ steps.state.outputs.tag }}
      - id: version
        name: Require immutable version tag
        if: steps.state.outputs.build == 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          python - <<'PY'
          import json,os,re,tomllib
          tag=os.environ['TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?',tag):
              raise SystemExit('Run against a version tag, not a mutable branch.')
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert tag=='v'+version, 'Tag and source version differ'
          assert json.load(open('desktop/package.json'))['version']==version
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'version={version}\ntag={tag}\n')
          PY
  windows_android:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Cache Rust dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-1.93.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-1.93.1-
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup override set 1.93.1
          python -m pip install cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage reviewed on-demand phone bootstrap
        shell: pwsh
        run: python scripts/android-native/fetch_on_demand.py --output (Join-Path $env:RUNNER_TEMP 'phone-bootstrap') --abi arm64-v8a
      - name: Test, sign and package
        shell: pwsh
        env:
          POCKET_SIGNING_KEY_BASE64: ${{ secrets.POCKET_SIGNING_KEY_BASE64 }}
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
          POCKET_EXPECTED_SIGNER: ${{ vars.POCKET_EXPECTED_SIGNER }}
          POCKET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.POCKET_UPDATE_PRIVATE_KEY_PEM }}
          POCKET_UPDATE_TRUST_JSON: ${{ vars.POCKET_UPDATE_TRUST_JSON }}
          POCKET_UPDATE_ASSET_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}
        run: ./scripts/ci-release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'pocket-release') -OnDeviceRuntime (Join-Path $env:RUNNER_TEMP 'phone-bootstrap') -OnDeviceAbis arm64-v8a
      - name: Preserve failed host test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-host-failure-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
            android/wire/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-android-release
          path: |
            ${{ runner.temp }}/pocket-release/*.apk
            ${{ runner.temp }}/pocket-release/*.zip
            ${{ runner.temp }}/pocket-release/*.exe
            ${{ runner.temp }}/pocket-release/*.nupkg
            ${{ runner.temp }}/pocket-release/*.json
            ${{ runner.temp }}/pocket-release/*.txt
          if-no-files-found: error
          retention-days: 14
  relay:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - name: Build immutable image archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker build -f deploy/relay.Dockerfile --label org.opencontainers.image.revision="$(git rev-parse HEAD)" --label org.opencontainers.image.version="$VERSION" -t "codex-pocket-relay:$VERSION" .
          mkdir -p release
          docker save "codex-pocket-relay:$VERSION" | gzip > "release/codex-pocket-$VERSION-relay-amd64.tar.gz"
          cd release
          sha256sum *.tar.gz > relay-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-release
          path: release/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [validate, windows_android, relay]
    if: needs.validate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          merge-multiple: true
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing.txt 2>/dev/null; then
            test "$(cat existing.txt)" = true || { echo 'Published release is immutable'; exit 1; }
            gh release upload "$RELEASE_TAG" release/*
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "Codex Pocket $RELEASE_TAG"
          fi
