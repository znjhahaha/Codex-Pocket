name: Release draft
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: version
        name: Require immutable version tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import json,os,re,tomllib
          tag=os.environ['TAG']
          if os.environ['REF_TYPE']!='tag' or not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?',tag):
              raise SystemExit('Run against a version tag, not a mutable branch.')
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert tag=='v'+version, 'Tag and source version differ'
          assert json.load(open('desktop/package.json'))['version']==version
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'version={version}\ntag={tag}\n')
          PY
  windows_android:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 65
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup override set 1.93.1
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test, sign and package
        shell: pwsh
        env:
          POCKET_SIGNING_KEY_BASE64: ${{ secrets.POCKET_SIGNING_KEY_BASE64 }}
          POCKET_SIGNING_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
          POCKET_EXPECTED_SIGNER: ${{ vars.POCKET_EXPECTED_SIGNER }}
        run: ./scripts/ci-release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'pocket-release')
      - name: Preserve failed host test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-host-failure-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
            android/wire/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-android-release
          path: |
            ${{ runner.temp }}/pocket-release/*.apk
            ${{ runner.temp }}/pocket-release/*.zip
            ${{ runner.temp }}/pocket-release/*.exe
            ${{ runner.temp }}/pocket-release/*.json
            ${{ runner.temp }}/pocket-release/*.txt
          if-no-files-found: error
          retention-days: 14
  relay:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build immutable image archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker build -f deploy/relay.Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.version="$VERSION" -t "codex-pocket-relay:$VERSION" .
          mkdir -p release
          docker save "codex-pocket-relay:$VERSION" | gzip > "release/codex-pocket-$VERSION-relay-amd64.tar.gz"
          cd release
          sha256sum *.tar.gz > relay-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-release
          path: release/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [validate, windows_android, relay]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          merge-multiple: true
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing.txt 2>/dev/null; then
            test "$(cat existing.txt)" = true || { echo 'Published release is immutable'; exit 1; }
            gh release upload "$RELEASE_TAG" release/*
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "Codex Pocket $RELEASE_TAG"
          fi
