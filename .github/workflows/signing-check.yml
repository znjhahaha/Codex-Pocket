name: Signing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Inspect original certificate and freshly built APK
        shell: pwsh
        env:
          POCKET_SIGNING_KEY_BASE64: ${{ secrets.POCKET_SIGNING_KEY_BASE64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_SIGNING_PASSWORD }}
          POCKET_EXPECTED_SIGNER: ${{ vars.POCKET_EXPECTED_SIGNER }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/build-release.ps1
          $env:POCKET_KEYSTORE=Join-Path $env:RUNNER_TEMP ('signing-'+[guid]::NewGuid().ToString('N')+'.jks')
          try {
            [IO.File]::WriteAllBytes($env:POCKET_KEYSTORE,[Convert]::FromBase64String($env:POCKET_SIGNING_KEY_BASE64))
            Remove-Item Env:POCKET_SIGNING_KEY_BASE64
            $env:POCKET_KEY_PASSWORD=$env:POCKET_STORE_PASSWORD
            $env:POCKET_KEY_ALIAS='codex-pocket'
            $cert=@(& keytool -exportcert -rfc -keystore $env:POCKET_KEYSTORE -storepass:env POCKET_STORE_PASSWORD -alias codex-pocket 2>&1 | ForEach-Object { "$_" })
            if($LASTEXITCODE -ne 0){throw 'Public certificate export failed'}
            $pem=[regex]::Match(($cert -join "`n"),'(?s)-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----')
            $expected=Get-PocketBytesHash ([Convert]::FromBase64String(($pem.Groups[1].Value -replace '\s','')))
            Write-Host "Public certificate SHA256: $expected"
            if($expected -ne $env:POCKET_EXPECTED_SIGNER){throw 'Configured key differs from approved public certificate'}
            & ./android/gradlew.bat -p android :app:assembleRelease --no-daemon
            if($LASTEXITCODE -ne 0){throw 'APK build failed'}
            $signer=Find-PocketApkSigner $PWD.Path
            Write-Host "Selected verifier: $signer"
            $verification=@(& $signer verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1)
            $exit=$LASTEXITCODE
            # Only public certificate/algorithm diagnostics; no signing secrets or APK payload.
            $verification | ForEach-Object { Write-Host "$_" }
            if($exit -ne 0){throw 'APK verification failed'}
            Assert-PocketApkSignerIdentity -Verification $verification -ExpectedSigner $expected
          } finally {
            if(Test-Path -LiteralPath $env:POCKET_KEYSTORE){Remove-Item -LiteralPath $env:POCKET_KEYSTORE -Force}
            Remove-Item Env:POCKET_STORE_PASSWORD,Env:POCKET_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
