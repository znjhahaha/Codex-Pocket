name: Checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Native tests
        run: cargo +1.93.1 test --locked --workspace --no-fail-fast
      - name: Desktop runtime tests
        run: cargo +1.93.1 test --locked --manifest-path desktop/Cargo.toml -p pocket-desktop-runtime
      - name: Frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Frontend tests and build
        working-directory: desktop
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Desktop UI checks
        working-directory: desktop
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
      - name: Desktop native command tests
        run: cargo +1.93.1 test --locked --manifest-path desktop/Cargo.toml -p pocket-desktop
      - name: Windows installer fixtures
        shell: pwsh
        run: |
          cargo +1.93.1 build --locked -p pocket-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-installer-tests.ps1
          ./scripts/windows-identity-installer-tests.ps1 -AgentPath (Join-Path $PWD 'target/debug/pocket-agent.exe')
          ./scripts/windows-native-path-tests.ps1
          ./scripts/apk-signer-tests.ps1
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-checks
          path: |
            desktop/playwright-report
            .local/v06-desktop-ui
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Host tests and lint
        run: bash android/gradlew -p android :wire:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --continue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-checks
          path: |
            android/app/build/reports
            android/wire/build/reports
          if-no-files-found: ignore
          retention-days: 7
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build relay container
        run: docker build --file deploy/relay.Dockerfile --tag pocket-relay:check .
