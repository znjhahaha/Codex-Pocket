[package]
name = "pocket-desktop-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs2.workspace = true
tempfile.workspace = true
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ssh2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com"] }

[[bin]]
name = "pocket-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "pocket-launcher"
path = "src/bin/launcher.rs"
