[workspace]
members = ["runtime", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
