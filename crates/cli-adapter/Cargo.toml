[package]
name = "codex-cli-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Passive discovery and attachment to the native Codex CLI shared daemon"

[dependencies]
dirs = "6.0.0"
dunce = "1.0.5"
futures-util = { version = "0.3.31", features = ["sink"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
async-io = "2.6.0"
tokio-util = { version = "0.7.16", features = ["compat"] }
uds_windows = "1.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt-multi-thread", "time"] }
